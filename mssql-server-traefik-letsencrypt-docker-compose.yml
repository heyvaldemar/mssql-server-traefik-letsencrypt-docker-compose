# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}
  mssql: &mssql-image ${MSSQL_IMAGE_TAG:-mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89}

networks:
  mssql-server-network:
    external: true
  traefik-network:
    external: true

volumes:
  mssql-server-data:
  mssql-server-backups:
  traefik-certificates:

services:
  mssql:
    image: *mssql-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MSSQL_SERVER_MSSQL_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MSSQL_SERVER_MSSQL_MEMORY_LIMIT:-2g}
          cpus: "${MSSQL_SERVER_MSSQL_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${MSSQL_SERVER_MSSQL_MEMORY_RESERVATION:-256m}
          cpus: "${MSSQL_SERVER_MSSQL_CPU_RESERVATION:-0.5}"
    platform: linux/amd64
    volumes:
      - mssql-server-data:/var/opt/mssql
      - mssql-server-backups:${MSSQL_BACKUPS_PATH:-/var/opt/mssql/backup}
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env - see .env.example}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    networks:
      - mssql-server-network
      - traefik-network
    healthcheck:
      # $$ defers expansion to the container: the SA password is read from
      # the service environment at runtime, never baked into the config.
      # sqlcmd lives under mssql-tools18 in current images; -C trusts the
      # instance's self-signed certificate for the local loopback check.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Define TCP router rules for MS SQL to match all incoming requests (HostSNI)
      - "traefik.tcp.routers.mssql.rule=HostSNI(`*`)"
      # Assign the MS SQL router to a named Traefik service
      - "traefik.tcp.routers.mssql.service=mssql"
      # Use the 'MS SQL' (custom) entry point
      - "traefik.tcp.routers.mssql.entrypoints=sql"
      # Define the internal container port for routing to the MS SQL service
      - "traefik.tcp.services.mssql.loadbalancer.server.port=1433"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Define the SQL entry point on port 1433
      - "--entryPoints.sql.address=:1433"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "1433:1433"
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *mssql-image
    platform: linux/amd64
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. MSSQL_SERVER_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MSSQL_SERVER_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${MSSQL_SERVER_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${MSSQL_SERVER_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${MSSQL_SERVER_BACKUPS_CPU_RESERVATION:-0.1}"
    # Runs as root only to own the shared backup directory: SQL Server (uid
    # 10001) writes the .bak files there, and a fresh named volume is
    # root-owned until someone fixes that.
    user: root
    entrypoint: ["/bin/bash", "-c"]
    # Every cycle: BACKUP DATABASE for master, msdb, and every online user
    # database (WITH CHECKSUM - no COMPRESSION, which Express does not
    # support), then RESTORE VERIFYONLY proves each file is restorable.
    # Logs 'Database backup OK'/'FAILED' per database; a failed file is kept
    # as .failed for diagnosis. Retention 0 disables pruning.
    command:
      - |
        set -o pipefail
        sql() { /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b "$$@"; }
        chown 10001:0 "$$MSSQL_BACKUPS_PATH" && chmod 770 "$$MSSQL_BACKUPS_PATH"
        sleep "$$MSSQL_BACKUP_INIT_SLEEP"
        while true; do
          STAMP="$$(date +%Y-%m-%d_%H-%M)"
          if ! DBS="$$(sql -h -1 -W -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE (name IN ('master','msdb') OR database_id > 4) AND state_desc = 'ONLINE'" | tr -d '\r' | grep -v '^$$')"; then
            echo "[$$(date -Iseconds)] Database backup FAILED - cannot list databases, is SQL Server reachable?" >&2
            DBS=""
          fi
          for db in $$DBS; do
            FILE="$$MSSQL_BACKUPS_PATH/$$MSSQL_BACKUP_NAME-$$db-$$STAMP.bak"
            echo "[$$(date -Iseconds)] Starting database backup of [$$db] to $$FILE"
            if sql -Q "BACKUP DATABASE [$$db] TO DISK = N'$$FILE' WITH INIT, FORMAT, CHECKSUM" > /dev/null \
               && sql -Q "RESTORE VERIFYONLY FROM DISK = N'$$FILE' WITH CHECKSUM" > /dev/null; then
              echo "[$$(date -Iseconds)] Database backup OK: $$FILE ($$(stat -c %s "$$FILE") bytes)"
            else
              echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$FILE.failed for diagnosis" >&2
              mv "$$FILE" "$$FILE.failed" 2>/dev/null || true
            fi
          done
          if [ "$${MSSQL_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
            find "$$MSSQL_BACKUPS_PATH" -type f -name "$$MSSQL_BACKUP_NAME-*" -mtime "+$$MSSQL_BACKUP_PRUNE_DAYS" -delete
          fi
          sleep "$$MSSQL_BACKUP_INTERVAL"
        done
    volumes:
      - mssql-server-backups:${MSSQL_BACKUPS_PATH:-/var/opt/mssql/backup}
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env - see .env.example}
      MSSQL_BACKUP_INIT_SLEEP: ${MSSQL_BACKUP_INIT_SLEEP:-30m}
      MSSQL_BACKUP_INTERVAL: ${MSSQL_BACKUP_INTERVAL:-24h}
      MSSQL_BACKUP_PRUNE_DAYS: ${MSSQL_BACKUP_PRUNE_DAYS:-7}
      MSSQL_BACKUPS_PATH: ${MSSQL_BACKUPS_PATH:-/var/opt/mssql/backup}
      MSSQL_BACKUP_NAME: ${MSSQL_BACKUP_NAME:-mssql-backup}
    networks:
      - mssql-server-network
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
